<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <radialGradient id="sunGlowFull" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Leaf Left Gradient -->
    <linearGradient id="leafLeftFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="60%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0F5132"/>
    </linearGradient>

    <!-- Leaf Right Gradient -->
    <linearGradient id="leafRightFull" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="60%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0F5132"/>
    </linearGradient>

    <!-- Center Sprout Gradient -->
    <linearGradient id="centerSproutFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Field Rows Gradients -->
    <linearGradient id="field1Full" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A3622"/>
      <stop offset="50%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#0A3622"/>
    </linearGradient>

    <linearGradient id="field2Full" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <linearGradient id="field3Full" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- LEFT EMBLEM ICON                           -->
  <!-- ========================================== -->
  <g transform="translate(10, 15)">
    <!-- Sun & Rays -->
    <polygon points="210,40 198,115 222,115" fill="#F59E0B"/>
    <polygon points="172,52 170,123 193,119" fill="#F59E0B"/>
    <polygon points="248,52 227,119 250,123" fill="#F59E0B"/>
    <polygon points="135,74 144,142 165,132" fill="#F59E0B"/>
    <polygon points="285,74 255,132 276,142" fill="#F59E0B"/>
    <polygon points="105,108 125,166 142,152" fill="#F59E0B"/>
    <polygon points="315,108 278,152 295,166" fill="#F59E0B"/>
    <polygon points="85,150 116,193 129,176" fill="#F59E0B"/>
    <polygon points="335,150 291,176 304,193" fill="#F59E0B"/>

    <circle cx="210" cy="165" r="74" fill="url(#sunGlowFull)"/>

    <!-- Bottom Fields -->
    <path d="M 70,265 C 102,375 318,375 350,265 C 300,305 120,305 70,265 Z" fill="url(#field1Full)"/>
    <path d="M 88,285 C 128,370 292,370 332,285 C 292,315 128,315 88,285 Z" fill="url(#field2Full)"/>
    <path d="M 115,306 C 151,365 269,365 305,306 C 269,328 151,328 115,306 Z" fill="url(#field3Full)"/>

    <!-- Contour Lines -->
    <path d="M 65,260 Q 210,315 355,260" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M 83,283 Q 210,333 337,283" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M 108,306 Q 210,351 312,306" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 141,333 Q 210,369 279,333" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Wing Leaves -->
    <path d="M 205,283 C 137,278 52,233 48,152 C 79,174 156,206 205,283 Z" fill="url(#leafLeftFull)" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 215,283 C 283,278 368,233 372,152 C 341,174 264,206 215,283 Z" fill="url(#leafRightFull)" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Left Circuit Lines -->
    <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 187,265 L 142,238 L 111,238 L 89,207"/>
      <circle cx="89" cy="207" r="5" fill="#FFFFFF" stroke="none"/>
      <path d="M 178,251 L 147,220 L 118,220 L 104,198"/>
      <circle cx="104" cy="198" r="4.5" fill="#FFFFFF" stroke="none"/>
      <path d="M 196,274 L 160,256 L 133,256 L 111,229"/>
      <circle cx="111" cy="229" r="4" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Right Circuit Lines -->
    <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 233,265 L 278,238 L 309,238 L 331,207"/>
      <circle cx="331" cy="207" r="5" fill="#FFFFFF" stroke="none"/>
      <path d="M 242,251 L 273,220 L 302,220 L 316,198"/>
      <circle cx="316" cy="198" r="4.5" fill="#FFFFFF" stroke="none"/>
      <path d="M 224,274 L 260,256 L 287,256 L 309,229"/>
      <circle cx="309" cy="229" r="4" fill="#FFFFFF" stroke="none"/>
    </g>

    <!-- Center Sprout Shoot -->
    <path d="M 210,130 C 192,161 192,206 210,242 C 228,206 228,161 210,130 Z" fill="url(#centerSproutFull)" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 210,211 C 178,193 160,166 160,166 C 178,184 201,206 210,229 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 210,211 C 242,193 260,166 260,166 C 242,184 219,206 210,229 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 210,238 C 178,225 147,207 147,207 C 169,225 196,242 210,261 Z" fill="#22C55E" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 210,238 C 242,225 273,207 273,207 C 251,225 224,242 210,261 Z" fill="#22C55E" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT TYPOGRAPHY WORDMARK                  -->
  <!-- ========================================== -->
  <g transform="translate(410, 0)">
    <!-- SMART-AGRI -->
    <text x="0" y="245" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="-1px"
          fill="#064E3B">SMART-AGRI</text>

    <!-- HORIZONTAL LEFT BAR -->
    <rect x="0" y="302" width="140" height="9" rx="4.5" fill="#16A34A"/>

    <!-- KENYA -->
    <text x="300" y="322" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="80" 
          font-weight="900" 
          letter-spacing="0.32em"
          text-anchor="middle"
          fill="#16A34A">KENYA</text>

    <!-- HORIZONTAL RIGHT BAR -->
    <rect x="460" y="302" width="140" height="9" rx="4.5" fill="#16A34A"/>
  </g>
</svg>
